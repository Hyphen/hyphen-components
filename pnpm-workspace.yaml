packages:
  - 'packages/*'

overrides:
  handlebars: 4.7.10
  # Patched release for GHSA-wjr9-j795-jxcr.
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # Patched releases for GHSA-q2hr-2g5m-vwhr.
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12

# Quarantine newly published dependency versions for 7 days. Keep lockfile
# verification enabled so this policy also applies to frozen CI installs.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
ignoreScripts: true

# esbuild needs its binary setup; core-js only uses postinstall messaging.
allowBuilds:
  esbuild: true
  core-js: false
  '@parcel/watcher': true
