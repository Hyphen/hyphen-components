packages:
  - 'packages/*'

overrides:
  handlebars: 4.7.10
  # Patched release for GHSA-wjr9-j795-jxcr.
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # Patched releases for GHSA-q2hr-2g5m-vwhr.
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  # Patch Jest's NYC config loader dependency for GHSA-2883-xcg3-v3hh.
  '@istanbuljs/load-nyc-config@1.1.0>js-yaml': 3.15.2

# Quarantine newly published dependency versions for 7 days. Keep lockfile
# verification enabled so this policy also applies to frozen CI installs.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Vite 8.3.7 and its Rolldown release fix GHSA-p4f5-76q4-ffq7.
# Remove after 2026-11-16 10:26 UTC.
minimumReleaseAgeExclude:
  - 'vite@8.3.7'
  - 'rolldown@1.2.18'
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
trustLockfile: false
ignoreScripts: true

# esbuild needs its binary setup; core-js only uses postinstall messaging.
allowBuilds:
  esbuild: true
  core-js: false
  '@parcel/watcher': true
