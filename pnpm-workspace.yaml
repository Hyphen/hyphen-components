packages:
  - 'packages/*'

overrides:
  handlebars: 4.7.9
  # Patched releases for GHSA-rgw5-rvv9-x895 (Dependabot alert 216).
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9

# Quarantine newly published dependency versions for 7 days. Keep lockfile
# verification enabled so this policy also applies to frozen CI installs.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Allow these security patches through the release-age quarantine.
# TODO: Remove these exemptions after 2026-08-06, when both releases mature.
minimumReleaseAgeExclude:
  - 'brace-expansion@1.1.18'
  - 'brace-expansion@5.0.9'
trustLockfile: false
ignoreScripts: true

# esbuild needs its binary setup; core-js only uses postinstall messaging.
allowBuilds:
  esbuild: true
  core-js: false
  '@parcel/watcher': true
